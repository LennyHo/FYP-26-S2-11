<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dialogflow CX Frontend</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-ui-bg">
        <div class="chat-ui-container">
            <div class="chat-ui-header">Chat Bot UI</div>
            <div class="chat-ui-content">
                <div class="chat-ui-icon">✨</div>
                <div class="chat-ui-title">Ask our AI anything</div>
                <div class="chat-ui-suggestions">
                    <button>What can I ask you to do?</button>
                    <button>Which one of my projects is performing the best?</button>
                    <button>What projects should I be concerned about right now?</button>
                </div>
                    <!-- Customer Support Chatbot Widget -->
                    <div id="support-chatbot-widget">
                        <div id="support-chatbot-collapsed" title="Chat with support">
                            <span>💬</span>
                        </div>
                        <div id="support-chatbot-expanded" style="display:none;">
                            <div class="support-chatbot-header">
                                <span>Customer Support</span>
                                <button id="support-chatbot-close" title="Close">&times;</button>
                            </div>
                            <div class="support-chatbot-messages">
                                <!-- Messages will appear here -->
                            </div>
                            <form class="support-chatbot-input-row" onsubmit="return false;">
                                <input type="text" placeholder="Type your message..." />
                                <button type="submit" class="support-chatbot-send-btn">&#9658;</button>
                            </form>
                        </div>
                    </div>
                    <!-- End Customer Support Chatbot Widget -->
                <form class="chat-ui-input-row" onsubmit="return false;">
                    <input type="text" placeholder="Ask me anything about your projects" />
                    <button type="submit" class="chat-ui-send-btn">&#9658;</button>
                </form>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
